name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dcc_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dcc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      - name: Deployment database tests
        run: pnpm exec vitest run --no-file-parallelism --testTimeout=15000 scripts/webhook-deployments.test.ts packages/database/src/migrate.test.ts packages/domain/src/notifications.db.test.ts packages/domain/src/ai-accounting.db.test.ts apps/web/src/pages/ai-usage.db.test.ts packages/domain/src/pr-review-publication.db.test.ts packages/database/src/va-jobs-platform-reconciliation.db.test.ts
        env:
          DCC_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dcc_test
